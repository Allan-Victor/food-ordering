spring:
  application:
    name: order-service

  # H2 in-memory: zero external setup for Slice 1.
  # The domain/application layers never see this — only the
  # persistence adapter does. Swapping to Postgres later touches
  # only this file + one dependency.
  datasource:
    url: jdbc:h2:mem:orderdb;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop        # rebuild schema each boot; learning only
    properties:
      hibernate:
        format_sql: true
    show-sql: true

  # H2 web console at http://localhost:8080/h2-console
  # (JDBC URL: jdbc:h2:mem:orderdb)
  h2:
    console:
      enabled: true

  threads:
    virtual:
      enabled: true                # Java 25 virtual threads

logging:
  level:
    com.allan.food: DEBUG
    org.hibernate.SQL: DEBUG
